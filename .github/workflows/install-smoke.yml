name: Install smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fresh-install:
    name: Fresh install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Build workspace from fresh install
        run: pnpm build

      - name: Exercise fresh local installation
        run: node scripts/ci-install-smoke.mjs
