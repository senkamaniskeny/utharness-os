name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11.21.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Electron 39.8.10 still resolves extract-zip 2.0.1; patches/extract-zip@2.0.1.patch rejects symlink archive entries.
      - run: pnpm audit --audit-level high --ignore GHSA-jmr9-qjv8-65gv
