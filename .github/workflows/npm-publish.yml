name: Publish npm packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @utharness/cli build
      - run: pnpm --filter @utharness/tui build
      - name: Publish packages when a token is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; packages were built but not published."
            exit 0
          fi
          pnpm --filter @utharness/cli publish --access public --no-git-checks
          pnpm --filter @utharness/tui publish --access public --no-git-checks
