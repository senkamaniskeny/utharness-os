<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">UTHARNESS OS mark</title>
  <desc id="desc">A luminous cyan, blue, lime, and amber U mark inside a deep green command badge.</desc>
  <defs>
    <linearGradient id="badge" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b2f43" />
      <stop offset="0.55" stop-color="#071d2a" />
      <stop offset="1" stop-color="#04130e" />
    </linearGradient>
    <linearGradient id="left" x1="32" y1="31" x2="62" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc" />
      <stop offset="0.5" stop-color="#00b4ff" />
      <stop offset="1" stop-color="#0b77e3" />
    </linearGradient>
    <linearGradient id="right" x1="62" y1="34" x2="94" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd34f" />
      <stop offset="0.45" stop-color="#ffad22" />
      <stop offset="1" stop-color="#9ef01a" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="57" fill="#02130e" stroke="#1cff66" stroke-opacity=".35" stroke-width="2" />
  <circle cx="64" cy="64" r="50" fill="url(#badge)" stroke="#08cfff" stroke-opacity=".48" stroke-width="2" />
  <path d="M25 31v31c0 21 15 37 35 37 8 0 15-2 21-6" fill="none" stroke="url(#left)" stroke-linecap="round" stroke-width="13" filter="url(#glow)" />
  <path d="M76 30v31c0 15-8 25-20 33" fill="none" stroke="#1173d7" stroke-linecap="round" stroke-width="13" />
  <path d="M76 30v31c0 14-6 24-18 33" fill="none" stroke="url(#right)" stroke-linecap="round" stroke-width="10" />
  <path d="M76 30v31c0 14-6 24-18 33" fill="none" stroke="#d7ff38" stroke-linecap="round" stroke-width="3" opacity=".9" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="#7dd3fc" stroke-opacity=".22" stroke-width="1" />
</svg>
